name: ELXVRO APK Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: ELXVRO ZIP'i ac ve proje klasorunu bul
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f \( -iname 'elxvro-wallpaper-app.zip' -o -iname 'ELXVRO-Wallpaper-App-v1.zip' -o -iname '*.zip' \) | head -n 1)"

          if [ -z "${ZIP_FILE:-}" ]; then
            echo "HATA: Repository ana dizininde ZIP dosyasi bulunamadi."
            exit 1
          fi

          rm -rf _elxvro_build
          mkdir -p _elxvro_build
          unzip -q "$ZIP_FILE" -d _elxvro_build

          PUBSPEC="$(find _elxvro_build -type f -name pubspec.yaml | head -n 1)"
          if [ -z "${PUBSPEC:-}" ]; then
            echo "HATA: ZIP icinde pubspec.yaml bulunamadi."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter proje klasoru: $PROJECT_DIR"

      - name: Android proje dosyalarini tamamla
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter create . --platforms=android --org com.elxvro --project-name elxvro_wallpaper

      - name: Dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Analyze
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos

      - name: Build release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/ELXVRO.apk"

      - name: Build release AAB
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/ELXVRO.aab"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ELXVRO-APK
          path: dist/ELXVRO.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: ELXVRO-AAB
          path: dist/ELXVRO.aab
          if-no-files-found: error
