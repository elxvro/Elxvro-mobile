name: ELXVRO APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "elxvro-app.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository dosyalarini al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter surumunu goster
        run: flutter --version

      - name: ZIP kontrolu
        run: |
          if [ ! -f "elxvro-app.zip" ]; then
            echo "HATA: elxvro-app.zip bulunamadi."
            exit 1
          fi

      - name: ZIP dosyasini ac
        run: |
          rm -rf app_source
          mkdir -p app_source
          unzip -q elxvro-app.zip -d app_source

      - name: Flutter proje klasorunu bul
        id: project
        shell: bash
        run: |
          PUBSPEC=$(find app_source -name pubspec.yaml -type f | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "HATA: pubspec.yaml bulunamadi."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Proje klasoru: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Eski Android yapisini tamamen temizle
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          rm -rf android
          echo "Eski Android klasoru temizlendi."

      - name: Yeni Android v2 projesini olustur
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter create \
            --platforms=android \
            --org=com.elxvro \
            --project-name=elxvro \
            .

      - name: Internet iznini ekle
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")

          if "android.permission.INTERNET" not in text:
              end = text.find(">") + 1
              permission = '\n    <uses-permission android:name="android.permission.INTERNET"/>'
              text = text[:end] + permission + text[end:]

          text = text.replace(
              'android:label="elxvro"',
              'android:label="ELXVRO"'
          )

          path.write_text(text, encoding="utf-8")
          print(text)
          PY

      - name: Flutter paketlerini yukle
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter pub get

      - name: Flutter analizi
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter analyze
        continue-on-error: true

      - name: Release APK olustur
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter build apk \
            --release \
            --build-name=1.0.6 \
            --build-number=${{ github.run_number }}

      - name: APK kontrolu
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          ls -lah build/app/outputs/flutter-apk/

          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "HATA: APK olusturulamadi."
            exit 1
          fi

      - name: APK adini degistir
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/ELXVRO-v1.0.6.apk

      - name: APK artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: ELXVRO-APK-v1.0.6
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/ELXVRO-v1.0.6.apk
          if-no-files-found: error
          retention-days: 30
