name: ELXVRO APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "elxvro-app.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository dosyalarini al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter surumunu kontrol et
        run: flutter --version

      - name: ZIP dosyasini kontrol et
        run: |
          if [ ! -f "elxvro-app.zip" ]; then
            echo "HATA: elxvro-app.zip bulunamadi."
            exit 1
          fi

      - name: ZIP dosyasini ac
        run: |
          rm -rf app_source
          mkdir -p app_source
          unzip -q elxvro-app.zip -d app_source

          echo "ZIP acildi."
          find app_source -maxdepth 3 -type f | head -100

      - name: Flutter proje klasorunu bul
        id: project
        shell: bash
        run: |
          PUBSPEC=$(find app_source -name pubspec.yaml -type f | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "HATA: ZIP icinde pubspec.yaml bulunamadi."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter proje klasoru: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Android projesini hazirla
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ ! -d "android" ]; then
            echo "Android klasoru yok. Olusturuluyor..."

            flutter create \
              --platforms=android \
              --org=com.elxvro \
              --project-name=elxvro \
              .
          else
            echo "Android klasoru zaten mevcut."
          fi

      - name: Android internet iznini garanti et
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "HATA: AndroidManifest.xml bulunamadi."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in text:
              text = text.replace(
                  "<manifest",
                  "<manifest",
                  1
              )

              pos = text.find(">")
              text = (
                  text[:pos + 1]
                  + "\n    "
                  + permission
                  + text[pos + 1:]
              )

              path.write_text(text, encoding="utf-8")
              print("INTERNET izni eklendi.")
          else:
              print("INTERNET izni zaten mevcut.")
          PY

          echo "AndroidManifest.xml:"
          cat "$MANIFEST"

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            echo "HATA: INTERNET izni eklenemedi."
            exit 1
          fi

      - name: Flutter paketlerini yukle
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter pub get

      - name: Flutter temizle
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter clean

      - name: Paketleri tekrar hazirla
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter pub get

      - name: Flutter analizi
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter analyze
        continue-on-error: true

      - name: Release APK olustur
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter build apk \
            --release \
            --build-name=1.0.5 \
            --build-number=${{ github.run_number }}

      - name: APK dosyasini kontrol et
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "Olusturulan APK dosyalari:"
          ls -lah build/app/outputs/flutter-apk/

          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "HATA: app-release.apk olusturulamadi."
            exit 1
          fi

      - name: APK adini ELXVRO olarak degistir
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/ELXVRO-v1.0.5.apk

      - name: APK artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: ELXVRO-APK-v1.0.5
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/ELXVRO-v1.0.5.apk
          if-no-files-found: error
          retention-days: 30
