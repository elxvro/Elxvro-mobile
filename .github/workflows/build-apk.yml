name: ELXVRO APK Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: ELXVRO ZIP dosyasini ac
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f \( -iname 'elxvro-wallpaper-app.zip' -o -iname 'ELXVRO-Wallpaper-App-v1*.zip' -o -iname '*.zip' \) | head -n 1)"
          if [ -z "${ZIP_FILE:-}" ]; then
            echo "HATA: Repository ana dizininde ELXVRO ZIP dosyasi bulunamadi."
            exit 1
          fi

          rm -rf _elxvro_source _elxvro_build
          mkdir -p _elxvro_source
          unzip -q "$ZIP_FILE" -d _elxvro_source

          PUBSPEC="$(find _elxvro_source -type f -name pubspec.yaml | head -n 1)"
          if [ -z "${PUBSPEC:-}" ]; then
            echo "HATA: ZIP icinde pubspec.yaml bulunamadi."
            exit 1
          fi

          SOURCE_DIR="$(dirname "$PUBSPEC")"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "Kaynak proje: $SOURCE_DIR"

      - name: Temiz Android Flutter projesi olustur
        shell: bash
        run: |
          set -euo pipefail
          flutter create _elxvro_build \
            --platforms=android \
            --org com.elxvro \
            --project-name wallpaper

          rm -rf _elxvro_build/lib
          cp -R "$SOURCE_DIR/lib" _elxvro_build/lib
          cp "$SOURCE_DIR/pubspec.yaml" _elxvro_build/pubspec.yaml

          rm -rf _elxvro_build/assets
          cp -R "$SOURCE_DIR/assets" _elxvro_build/assets

          # Native Android duvar kagidi entegrasyonunu temiz projeye aktar.
          mkdir -p _elxvro_build/android/app/src/main/kotlin/com/elxvro/wallpaper
          cp "$SOURCE_DIR/android/app/src/main/kotlin/com/elxvro/wallpaper/MainActivity.kt" \
             _elxvro_build/android/app/src/main/kotlin/com/elxvro/wallpaper/MainActivity.kt
          cp "$SOURCE_DIR/android/app/src/main/AndroidManifest.xml" \
             _elxvro_build/android/app/src/main/AndroidManifest.xml

          # ELXVRO launcher iconu ve acilis temasi kaynaklarini aktar.
          if [ -d "$SOURCE_DIR/android/app/src/main/res" ]; then
            cp -R "$SOURCE_DIR/android/app/src/main/res/." \
               _elxvro_build/android/app/src/main/res/
          fi

          # Uygulama Android 7.0+ (API 24) hedefler; kilit ekrani wallpaper API'si icin gerekli.
          if [ -f _elxvro_build/android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' _elxvro_build/android/app/build.gradle.kts
          fi
          if [ -f _elxvro_build/android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' _elxvro_build/android/app/build.gradle
          fi

          # flutter create'in varsayilan MyApp testini build analizine sokma.
          rm -rf _elxvro_build/test

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/_elxvro_build" >> "$GITHUB_ENV"

      - name: Release keystore hazirla
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ELXVRO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ELXVRO_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -n "$KEYSTORE_PASSWORD" || { echo "HATA: ELXVRO_KEYSTORE_PASSWORD secret eksik"; exit 1; }
          test -n "$KEYSTORE_B64" || { echo "HATA: ELXVRO_KEYSTORE_BASE64 secret eksik"; exit 1; }

          python3 <<'PYBASE64'
          import base64
          import os
          import re
          from pathlib import Path

          value = re.sub(r'\s+', '', os.environ['KEYSTORE_B64'].strip())
          if len(value) >= 2 and value[0] == value[-1] and value[0] in ('"', "'"):
              value = value[1:-1]
          if ';base64,' in value:
              value = value.split(';base64,', 1)[1]

          try:
              decoded = base64.b64decode(value, validate=True)
          except Exception as exc:
              raise SystemExit('HATA: ELXVRO_KEYSTORE_BASE64 gecerli Base64 degil.') from exc

          if len(decoded) < 500:
              raise SystemExit('HATA: Release keystore gecersiz veya eksik.')

          target = Path('android/app/elxvro-release.jks')
          target.write_bytes(decoded)
          print(f'Release keystore hazir: {len(decoded)} bayt')
          PYBASE64

          ACTUAL_SHA1=$(keytool -list -v \
            -keystore android/app/elxvro-release.jks \
            -alias elxvro \
            -storepass "$KEYSTORE_PASSWORD" \
            | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1)

          EXPECTED_SHA1="6B:24:70:EB:30:85:61:A7:30:A0:CA:1B:CA:ED:64:9E:1F:7C:9C:4F"
          echo "Release keystore SHA-1: $ACTUAL_SHA1"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "HATA: Release keystore SHA-1 Google OAuth kaydiyla eslesmiyor."
            echo "Beklenen: $EXPECTED_SHA1"
            echo "Bulunan:  $ACTUAL_SHA1"
            exit 1
          fi

      - name: Android release signing ayarla
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ELXVRO_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=elxvro
          storeFile=elxvro-release.jks
          EOF

          python3 <<'PY'
          from pathlib import Path

          kts = Path('android/app/build.gradle.kts')
          groovy = Path('android/app/build.gradle')

          if kts.exists():
              s = kts.read_text(encoding='utf-8')
              imports = 'import java.util.Properties\nimport java.io.FileInputStream\n\n'
              if 'import java.util.Properties' not in s:
                  s = imports + s

              setup = 'val keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n}\n\n'
              if 'val keystoreProperties = Properties()' not in s:
                  s = s.replace('android {', setup + 'android {', 1)

              signing = '    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n\n'
              if 'create("release")' not in s:
                  s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)

              old = 'signingConfig = signingConfigs.getByName("debug")'
              if old not in s:
                  raise SystemExit('HATA: KTS debug signing satiri bulunamadi.')
              s = s.replace(old, 'signingConfig = signingConfigs.getByName("release")', 1)
              kts.write_text(s, encoding='utf-8')
          elif groovy.exists():
              s = groovy.read_text(encoding='utf-8')
              setup = "def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file('key.properties')\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n}\n\n"
              if 'def keystoreProperties = new Properties()' not in s:
                  s = setup + s
              signing = "    signingConfigs {\n        release {\n            keyAlias keystoreProperties['keyAlias']\n            keyPassword keystoreProperties['keyPassword']\n            storeFile file(keystoreProperties['storeFile'])\n            storePassword keystoreProperties['storePassword']\n        }\n    }\n\n"
              if 'signingConfigs {' not in s:
                  s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)
              old = 'signingConfig signingConfigs.debug'
              if old not in s:
                  raise SystemExit('HATA: Groovy debug signing satiri bulunamadi.')
              s = s.replace(old, 'signingConfig signingConfigs.release', 1)
              groovy.write_text(s, encoding='utf-8')
          else:
              raise SystemExit('HATA: Android app Gradle dosyasi bulunamadi.')
          PY

      - name: Dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Analyze
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos

      - name: APK surumunu olustur
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter build apk --release

          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK" || { echo "HATA: APK olusmadi"; exit 1; }

          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/elxvro-apk-cert.txt

          ACTUAL_SHA1=$(sed -n 's/.*certificate SHA-1 digest: //p' /tmp/elxvro-apk-cert.txt | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
          EXPECTED_SHA1="6b2470eb308561a730a0ca1bcaed649e1f7c9c4f"
          echo "APK SHA-1: $ACTUAL_SHA1"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "HATA: APK Google OAuth icin beklenen release sertifikasi ile imzalanmadi."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/ELXVRO.apk"

      - name: AAB surumunu olustur
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/ELXVRO.aab"

      - name: APK artifact yukle
        uses: actions/upload-artifact@v7
        with:
          name: ELXVRO-APK
          path: dist/ELXVRO.apk
          if-no-files-found: error

      - name: Google Play AAB artifact yukle
        uses: actions/upload-artifact@v7
        with:
          name: ELXVRO-AAB
          path: dist/ELXVRO.aab
          if-no-files-found: error
