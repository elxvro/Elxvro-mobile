name: ELXVRO APK Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ELXVRO-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Google Play AAB artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: ELXVRO-PLAY-AAB-v1.6.0
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/bundle/release/ELXVRO-v1.6.0.aab
          if-no-files-found: error
          retention-days: 30

      - name: Test APK artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: ELXVRO-APK-v1.6.0
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/ELXVRO-v1.6.0.apk
          if-no-files-found: error
          retention-days: 30
