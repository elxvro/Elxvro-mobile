name: ELXVRO v1.5.0 Google Play Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "elxvro-app.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository dosyalarini al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: ZIP kontrolu ve ac
        run: |
          test -f elxvro-app.zip || { echo "HATA: elxvro-app.zip bulunamadi"; exit 1; }
          rm -rf app_source
          mkdir -p app_source
          unzip -q elxvro-app.zip -d app_source

      - name: Flutter proje klasorunu bul
        id: project
        shell: bash
        run: |
          PUBSPEC=$(find app_source -name pubspec.yaml -type f | head -n 1)
          test -n "$PUBSPEC" || { echo "HATA: pubspec.yaml bulunamadi"; exit 1; }
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Proje: $PROJECT_DIR"

      - name: Android projesini sifirdan olustur
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          rm -rf android
          flutter create \
            --platforms=android \
            --org=com.elxvro \
            --project-name=elxvro \
            .

      - name: Android 16 SDK kur ve API 36 hedefle
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" >/dev/null || true
          fi

          python3 <<'PYAPI'
          from pathlib import Path
          import re

          p = Path('android/app/build.gradle.kts')
          text = p.read_text(encoding='utf-8')
          text, c1 = re.subn(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', text)
          text, c2 = re.subn(r'targetSdk\s*=\s*flutter\.targetSdkVersion', 'targetSdk = 36', text)
          if c1 != 1 or c2 != 1:
              raise SystemExit(f'HATA: API 36 Gradle alanlari bulunamadi. compile={c1}, target={c2}')
          p.write_text(text, encoding='utf-8')
          print('compileSdk=36 ve targetSdk=36 uygulandi.')
          PYAPI

      - name: Android izinlerini ekle
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text(encoding='utf-8')
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.SET_WALLPAPER"/>',
          ]
          insert_at = text.find('>') + 1
          additions = ['\n    ' + p for p in permissions if p not in text]
          if additions:
              text = text[:insert_at] + ''.join(additions) + text[insert_at:]
          text = text.replace('android:label="elxvro"', 'android:label="ELXVRO"')
          path.write_text(text, encoding='utf-8')
          PY

      - name: ELXVRO uygulama ikonunu uygula
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          for DENSITY in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            ICON="assets/branding/elxvro_icon_${DENSITY}.png"
            test -s "$ICON" || { echo "HATA: ELXVRO $DENSITY ikon dosyasi bulunamadi"; exit 1; }
            DIR="android/app/src/main/res/mipmap-$DENSITY"
            mkdir -p "$DIR"
            cp "$ICON" "$DIR/ic_launcher.png"
          done

          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/elxvro_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="elxvro_launch_bg">#07090E</color>
          </resources>
          XML

          cat > android/app/src/main/res/drawable/launch_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/elxvro_launch_bg" />
              <item>
                  <bitmap android:gravity="center" android:src="@mipmap/ic_launcher" />
              </item>
          </layer-list>
          XML

          mkdir -p android/app/src/main/res/drawable-v21
          cp android/app/src/main/res/drawable/launch_background.xml \
             android/app/src/main/res/drawable-v21/launch_background.xml

          mkdir -p android/app/src/main/res/values-v31
          cat > android/app/src/main/res/values-v31/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:forceDarkAllowed">false</item>
                  <item name="android:windowSplashScreenBackground">@color/elxvro_launch_bg</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@mipmap/ic_launcher</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">@color/elxvro_launch_bg</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          XML
          echo "ELXVRO launcher icon ve native splash uygulandi."

      - name: Wallpaper cache modulunu ekle
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/kotlin -name MainActivity.kt -type f | head -n 1)
          test -n "$MAIN_ACTIVITY" || { echo "HATA: MainActivity.kt bulunamadi"; exit 1; }

          cat > "$MAIN_ACTIVITY" <<'KOTLIN'
          package com.elxvro.elxvro
          
          import android.app.WallpaperManager
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.Rect
          import android.graphics.RectF
          import android.net.Uri
          import android.os.Build
          import android.util.DisplayMetrics
          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileOutputStream
          import java.io.IOException
          import java.security.MessageDigest
          import kotlin.math.max
          import kotlin.math.roundToInt
          
          class MainActivity : FlutterActivity() {
              private val wallpaperChannelName = "com.elxvro/wallpaper"
              private val browserChannelName = "com.elxvro/browser"
          
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
          
                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      wallpaperChannelName
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "prepareWallpaperFile" -> {
                              val filePath = call.argument<String>("path")
                              if (filePath.isNullOrBlank()) {
                                  result.error("INVALID_PATH", "Onbellek gorseli bulunamadi.", null)
                              } else {
                                  prepareWallpaperFile(filePath, result)
                              }
                          }
                          "setWallpaperPrepared" -> {
                              val preparedPath = call.argument<String>("path")
                              val target = call.argument<String>("target") ?: "home"
                              if (preparedPath.isNullOrBlank()) {
                                  result.error("INVALID_PATH", "Hazir duvar kagidi bulunamadi.", null)
                              } else {
                                  setWallpaperPrepared(preparedPath, target, result)
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }
          
                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      browserChannelName
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "openUrl" -> {
                              val rawUrl = call.argument<String>("url")
                              if (rawUrl.isNullOrBlank()) {
                                  result.error("INVALID_URL", "Baglanti adresi bulunamadi.", null)
                                  return@setMethodCallHandler
                              }
                              try {
                                  val uri = Uri.parse(rawUrl)
                                  if (uri.scheme != "https") {
                                      result.error("INVALID_URL", "Yalnizca HTTPS baglantilari acilir.", null)
                                      return@setMethodCallHandler
                                  }
                                  startActivity(Intent(Intent.ACTION_VIEW, uri))
                                  result.success(true)
                              } catch (error: Exception) {
                                  result.error("OPEN_FAILED", error.message ?: "Baglanti acilamadi.", null)
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }
              }
          
              private fun cacheKey(value: String): String {
                  val digest = MessageDigest.getInstance("SHA-256").digest(value.toByteArray())
                  return digest.joinToString("") { "%02x".format(it) }
              }
          
              private fun preparedCacheFile(identity: String, width: Int, height: Int): File {
                  val dir = File(cacheDir, "wallpapers_prepared")
                  if (!dir.exists()) dir.mkdirs()
                  return File(dir, "${cacheKey("$identity|$width|$height")}.jpg")
              }
          
              private fun getWallpaperViewportSize(): Pair<Int, Int> {
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      val wm = getSystemService(WindowManager::class.java)
                      val bounds = wm.maximumWindowMetrics.bounds
                      Pair(bounds.width().coerceAtLeast(1), bounds.height().coerceAtLeast(1))
                  } else {
                      @Suppress("DEPRECATION")
                      val metrics = DisplayMetrics().also { windowManager.defaultDisplay.getRealMetrics(it) }
                      Pair(metrics.widthPixels.coerceAtLeast(1), metrics.heightPixels.coerceAtLeast(1))
                  }
              }
          
              private fun decodeSampled(file: File, targetWidth: Int, targetHeight: Int): Bitmap {
                  val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeFile(file.absolutePath, bounds)
                  if (bounds.outWidth <= 0 || bounds.outHeight <= 0) {
                      throw IOException("Gorsel boyutlari okunamadi.")
                  }
          
                  var sample = 1
                  while (
                      bounds.outWidth / (sample * 2) >= targetWidth &&
                      bounds.outHeight / (sample * 2) >= targetHeight
                  ) {
                      sample *= 2
                  }
          
                  val options = BitmapFactory.Options().apply {
                      inSampleSize = sample
                      inPreferredConfig = Bitmap.Config.ARGB_8888
                  }
                  return BitmapFactory.decodeFile(file.absolutePath, options)
                      ?: throw IOException("Gorsel Android tarafindan okunamadi.")
              }
          
              private fun centerCropToScreen(source: Bitmap, targetWidth: Int, targetHeight: Int): Bitmap {
                  val output = Bitmap.createBitmap(targetWidth, targetHeight, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(output)
                  val scale = max(
                      targetWidth.toFloat() / source.width.toFloat(),
                      targetHeight.toFloat() / source.height.toFloat()
                  )
                  val drawWidth = (source.width * scale).roundToInt().coerceAtLeast(1)
                  val drawHeight = (source.height * scale).roundToInt().coerceAtLeast(1)
                  val left = (targetWidth - drawWidth) / 2f
                  val top = (targetHeight - drawHeight) / 2f
                  val paint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG or Paint.DITHER_FLAG)
                  canvas.drawBitmap(
                      source,
                      Rect(0, 0, source.width, source.height),
                      RectF(left, top, left + drawWidth, top + drawHeight),
                      paint
                  )
                  return output
              }
          
              private fun prunePreparedCache(maxBytes: Long = 300L * 1024L * 1024L) {
                  val dir = File(cacheDir, "wallpapers_prepared")
                  val files = dir.listFiles()?.filter { it.isFile && !it.name.endsWith(".tmp") }
                      ?.sortedBy { it.lastModified() } ?: emptyList()
                  var total = files.sumOf { it.length() }
                  for (file in files) {
                      if (total <= maxBytes) break
                      val size = file.length()
                      if (file.delete()) total -= size
                  }
              }
          
              private fun ensurePreparedFromLocal(filePath: String): File {
                  val raw = File(filePath)
                  if (!raw.exists() || !raw.isFile || raw.length() <= 512) {
                      throw IOException("Onbellek gorseli gecersiz.")
                  }
          
                  val (screenWidth, screenHeight) = getWallpaperViewportSize()
                  val identity = "local:${raw.absolutePath}:${raw.length()}:${raw.lastModified()}"
                  val prepared = preparedCacheFile(identity, screenWidth, screenHeight)
                  synchronized(prepared.absolutePath.intern()) {
                      if (prepared.exists() && prepared.length() > 1024) {
                          prepared.setLastModified(System.currentTimeMillis())
                          return prepared
                      }
          
                      val source = decodeSampled(raw, screenWidth, screenHeight)
                      val fitted = centerCropToScreen(source, screenWidth, screenHeight)
                      val temp = File(prepared.absolutePath + ".tmp")
                      try {
                          FileOutputStream(temp).use { output ->
                              if (!fitted.compress(Bitmap.CompressFormat.JPEG, 90, output)) {
                                  throw IOException("Hazir duvar kagidi kaydedilemedi.")
                              }
                          }
                          if (temp.length() <= 1024) throw IOException("Hazir duvar kagidi gecersiz.")
                          if (prepared.exists()) prepared.delete()
                          if (!temp.renameTo(prepared)) {
                              temp.copyTo(prepared, overwrite = true)
                              temp.delete()
                          }
                          prepared.setLastModified(System.currentTimeMillis())
                          prunePreparedCache()
                          return prepared
                      } finally {
                          temp.takeIf { it.exists() && !prepared.exists() }?.delete()
                          if (fitted !== source) fitted.recycle()
                          source.recycle()
                      }
                  }
              }
          
              private fun prepareWallpaperFile(filePath: String, result: MethodChannel.Result) {
                  Thread {
                      try {
                          val prepared = ensurePreparedFromLocal(filePath)
                          runOnUiThread { result.success(prepared.absolutePath) }
                      } catch (error: Exception) {
                          runOnUiThread {
                              result.error("PREPARE_FAILED", error.message ?: "Gorsel hazirlanamadi.", null)
                          }
                      }
                  }.start()
              }
          
              private fun setWallpaperPrepared(
                  preparedPath: String,
                  target: String,
                  result: MethodChannel.Result
              ) {
                  Thread {
                      try {
                          val prepared = File(preparedPath)
                          if (!prepared.exists() || prepared.length() <= 1024) {
                              throw IOException("Hazir duvar kagidi dosyasi bulunamadi.")
                          }
          
                          val manager = WallpaperManager.getInstance(applicationContext)
                          prepared.inputStream().use { input ->
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                                  val which = when (target) {
                                      "home" -> WallpaperManager.FLAG_SYSTEM
                                      "lock" -> WallpaperManager.FLAG_LOCK
                                      "both" -> WallpaperManager.FLAG_SYSTEM or WallpaperManager.FLAG_LOCK
                                      else -> WallpaperManager.FLAG_SYSTEM
                                  }
                                  val id = manager.setStream(input, null, false, which)
                                  if (id == 0) throw IOException("Android duvar kagidini uygulayamadi.")
                              } else {
                                  if (target == "lock") {
                                      throw UnsupportedOperationException(
                                          "Bu Android surumu kilit ekranini ayri degistirmeyi desteklemiyor."
                                      )
                                  }
                                  manager.setStream(input)
                              }
                          }
                          runOnUiThread { result.success(true) }
                      } catch (error: Exception) {
                          val code = if (error is UnsupportedOperationException) "UNSUPPORTED" else "SET_FAILED"
                          runOnUiThread {
                              result.error(code, error.message ?: "Duvar kagidi ayarlanamadi.", null)
                          }
                      }
                  }.start()
              }
          }
          KOTLIN

      - name: Release keystore hazirla
        id: keystore
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          KEYSTORE_B64: ${{ secrets.ELXVRO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ELXVRO_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD" || { echo "HATA: ELXVRO_KEYSTORE_PASSWORD secret eksik"; exit 1; }
          test -n "$KEYSTORE_B64" || { echo "HATA: ELXVRO_KEYSTORE_BASE64 secret eksik"; exit 1; }

          python3 <<'PYBASE64'
          import base64
          import os
          import re
          from pathlib import Path

          raw = os.environ.get('KEYSTORE_B64', '')
          if not raw.strip():
              raise SystemExit('HATA: ELXVRO_KEYSTORE_BASE64 secret bos.')

          # GitHub/Windows kopyalamalarindan gelebilecek satir sonu ve bosluklari temizle.
          value = re.sub(r'\s+', '', raw.strip())

          # Yanlislikla deger tirnak icinde kaydedildiyse tolere et.
          if len(value) >= 2 and value[0] == value[-1] and value[0] in ('\"', "'"):
              value = value[1:-1]

          # data:...;base64, on eki ile kaydedildiyse yalnizca Base64 bolumunu al.
          if ';base64,' in value:
              value = value.split(';base64,', 1)[1]

          try:
              decoded = base64.b64decode(value, validate=True)
          except Exception as exc:
              bad = sorted(set(re.sub(r'[A-Za-z0-9+/=]', '', value)))
              details = ', '.join(repr(x) for x in bad[:8]) or 'padding/uzunluk hatasi'
              raise SystemExit(
                  f'HATA: ELXVRO_KEYSTORE_BASE64 gecerli Base64 degil. '
                  f'Karakter sayisi={len(value)}, supheli={details}. '
                  'Secret degerini yeniden olusturup sadece Base64 metnini yapistir.'
              ) from exc

          if len(decoded) < 500:
              raise SystemExit(
                  f'HATA: Cozulen keystore cok kucuk ({len(decoded)} bayt). '
                  'ELXVRO_KEYSTORE_BASE64 yanlis veya eksik kopyalanmis.'
              )

          target = Path('android/app/elxvro-release.jks')
          target.write_bytes(decoded)
          print(f'Keystore Base64 cozuldu: {len(decoded)} bayt')
          PYBASE64

          test -s android/app/elxvro-release.jks || { echo "HATA: Keystore dosyasi olusturulamadi"; exit 1; }
          echo "Keystore GitHub secret'tan yuklendi."

          keytool -list -v \
            -keystore android/app/elxvro-release.jks \
            -alias elxvro \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep -E 'SHA1:|SHA256:'

          ACTUAL_SHA1=$(keytool -list -v \
            -keystore android/app/elxvro-release.jks \
            -alias elxvro \
            -storepass "$KEYSTORE_PASSWORD" \
            | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1)

          EXPECTED_SHA1="6B:24:70:EB:30:85:61:A7:30:A0:CA:1B:CA:ED:64:9E:1F:7C:9C:4F"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "HATA: Keystore SHA-1 Google Cloud kaydiyla eslesmiyor."
            echo "Beklenen: $EXPECTED_SHA1"
            echo "Bulunan:  $ACTUAL_SHA1"
            exit 1
          fi

      - name: Android release signing ayarla
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ELXVRO_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=elxvro
          storeFile=elxvro-release.jks
          EOF

          python3 <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          if not p.exists():
              raise SystemExit('HATA: build.gradle.kts bulunamadi')
          s = p.read_text(encoding='utf-8')
          imports = '''import java.util.Properties\nimport java.io.FileInputStream\n\n'''
          if 'import java.util.Properties' not in s:
              s = imports + s
          marker = 'android {'
          setup = '''val keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n}\n\n'''
          if 'val keystoreProperties = Properties()' not in s:
              s = s.replace(marker, setup + marker, 1)
          old = '''    buildTypes {\n        release {\n            // TODO: Add your own signing config for the release build.\n            // Signing with the debug keys for now, so `flutter run --release` works.\n            signingConfig = signingConfigs.getByName("debug")\n        }\n    }'''
          new = '''    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n\n    buildTypes {\n        release {\n            signingConfig = signingConfigs.getByName("release")\n        }\n    }'''
          if old not in s:
              raise SystemExit('HATA: Flutter release signing blogu beklenen formatta degil')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Play release version code olustur
        id: release_version
        shell: bash
        run: |
          CODE=$((150000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "ELXVRO versionName=1.5.0 versionCode=$CODE"

      - name: Flutter paketlerini yukle
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter pub get

      - name: Flutter analizi
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter analyze --no-fatal-infos

      - name: Flutter testleri
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter test

      - name: Google Play AAB olustur
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter build appbundle \
            --release \
            --build-name=1.5.0 \
            --build-number=${{ steps.release_version.outputs.code }}

      - name: Test icin release APK olustur
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter build apk \
            --release \
            --build-name=1.5.0 \
            --build-number=${{ steps.release_version.outputs.code }}

      - name: AAB imzasini dogrula
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "HATA: AAB olusmadi"; exit 1; }
          keytool -printcert -jarfile "$AAB" | tee /tmp/aab-cert.txt

          EXPECTED_SHA1="6B:24:70:EB:30:85:61:A7:30:A0:CA:1B:CA:ED:64:9E:1F:7C:9C:4F"
          ACTUAL_SHA1=$(sed -n 's/^[[:space:]]*SHA1: //p' /tmp/aab-cert.txt | head -n 1)
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "HATA: AAB beklenen upload keystore ile imzalanmadi"
            echo "Beklenen: $EXPECTED_SHA1"
            echo "Bulunan:  $ACTUAL_SHA1"
            exit 1
          fi
          cp "$AAB" build/app/outputs/bundle/release/ELXVRO-v1.5.0.aab

      - name: APK imzasini dogrula
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK" || { echo "HATA: APK olusmadi"; exit 1; }
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner verify --print-certs "$APK" | tee /tmp/apk-cert.txt

          EXPECTED_SHA1_NORMALIZED="6b2470eb308561a730a0ca1bcaed649e1f7c9c4f"
          ACTUAL_SHA1_NORMALIZED=$(sed -n 's/.*certificate SHA-1 digest: //p' /tmp/apk-cert.txt | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')

          if [ "$ACTUAL_SHA1_NORMALIZED" != "$EXPECTED_SHA1_NORMALIZED" ]; then
            echo "HATA: APK beklenen upload keystore ile imzalanmadi"
            exit 1
          fi
          cp "$APK" build/app/outputs/flutter-apk/ELXVRO-v1.5.0.apk

      - name: Google Play AAB artifact yukle
        uses: actions/upload-artifact@v4
        with:
