name: ELXVRO Release Key

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Keystore olustur
        run: |
          keytool -genkeypair \
            -keystore elxvro-release.jks \
            -storetype JKS \
            -alias elxvro \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.ELXVRO_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.ELXVRO_KEYSTORE_PASSWORD }}" \
            -dname "CN=ELXVRO, OU=ELXVRO, O=ELXVRO, L=Istanbul, ST=Istanbul, C=TR"

      - name: SHA1 goster
        run: |
          keytool -list -v \
            -keystore elxvro-release.jks \
            -alias elxvro \
            -storepass "${{ secrets.ELXVRO_KEYSTORE_PASSWORD }}"

      - name: Keystore indir
        uses: actions/upload-artifact@v4
        with:
          name: ELXVRO-RELEASE-KEY
          path: elxvro-release.jks
          retention-days: 90
