name: ELXVRO Release Key

on:
  workflow_dispatch:

jobs:
  generate-key:
    runs-on: ubuntu-latest

    steps:
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Release keystore olustur
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore elxvro-release.jks \
            -storetype JKS \
            -alias elxvro \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.ELXVRO_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.ELXVRO_KEYSTORE_PASSWORD }}" \
            -dname "CN=ELXVRO, OU=ELXVRO, O=ELXVRO, L=Istanbul, ST=Istanbul, C=TR"

      - name: SHA1 bilgisini goster
        shell: bash
        run: |
          echo "=============================="
          echo "ELXVRO SHA1"
          echo "=============================="

          keytool -list -v \
            -keystore elxvro-release.jks \
            -alias elxvro \
            -storepass "${{ secrets.ELXVRO_KEYSTORE_PASSWORD }}"

      - name: Keystore dosyasini artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: ELXVRO-RELEASE-KEY
          path: elxvro-release.jks
          if-no-files-found: error
          retention-days: 1
